<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الطقس الزراعي | تسجيل الدخول</title>

<link rel="stylesheet" href="style/style.css">

</head>

<body>

<div class="container">

<div class="form-box">

<div class="logo">
🌿
<h1>الطقس الزراعي</h1>
<p>تابع حالة الطقس لخدمة المزارعين</p>
</div>

<!-- تسجيل الدخول -->

<form id="loginForm">

<h2>تسجيل الدخول</h2>

<input
type="text"
placeholder="اسم المستخدم"
required>

<input
type="password"
placeholder="كلمة المرور"
required>

<button type="submit">
دخول
</button>

<p>

ليس لديك حساب؟

<a href="#" onclick="showRegister()">

إنشاء حساب

</a>

</p>

</form>

<!-- إنشاء حساب -->

<form id="registerForm">

<h2>إنشاء حساب</h2>

<input
type="text"
placeholder="الاسم الكامل"
required>

<input
type="email"
placeholder="البريد الإلكتروني"
required>

<input
type="text"
placeholder="اسم المستخدم"
required>

<input
type="password"
placeholder="كلمة المرور"
required>

<input
type="password"
placeholder="تأكيد كلمة المرور"
required>

<button type="submit">

إنشاء الحساب

</button>

<p>

لديك حساب؟

<a href="#" onclick="showLogin()">

تسجيل الدخول

</a>

</p>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
